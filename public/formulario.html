<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar una ruta | Rueda Libre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/ruedav2.css">
</head>
<body>
  <header class="sticky-top">
    <nav class="navbar lg:navbar-expand bg-1 fg-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="../ruedalibrenueva.html">Rueda Libre</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNavMenu" aria-controls="navbarNavMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavMenu" aria-labelledby="navbarNavMenuLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="../ruedalibrenueva.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="bicicletas.html">Bicicletas</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="rutas.html">Rutas</a>
              </li>
              <li class="nav-item">
                <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
                  Contactos
                </button>
                <div class="menu">
                  <a class="menu-item" href="mailto:contacto@ruedalibre.com">Contactanos via correo</a>
                  <a class="menu-item" href="tel:+34912345678">Llámanos</a>
                </div>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>
  </header>

  <main class="container formulario-page">
    <h1 class="titulo mt-4">Consultar una ruta</h1>
    <p class="rutas-intro">Déjanos tus datos y cuéntanos qué ruta te interesa.</p>

    <form class="formulario-panel mx-auto" id="formularioConsulta">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="name" required>
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="telefono" name="telefono" autocomplete="tel" required>
      </div>

      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" name="correo" autocomplete="email" required>
      </div>

      <div class="mb-3">
        <label for="ruta" class="form-label">¿Qué ruta deseas elegir?</label>
        <select class="form-select" id="ruta" name="ruta" required>
          <option value="" selected disabled>Selecciona una ruta</option>
          <option value="sendero-bosque">Montaña - Sendero del bosque (18 km)</option>
          <option value="cima-panoramica">Montaña - Cima panorámica (32 km)</option>
          <option value="paseo-urbano">Calle - Paseo urbano (10 km)</option>
          <option value="vuelta-costa">Calle - Vuelta por la costa (24 km)</option>
          <option value="vuelta-familiar">Parque - Vuelta familiar (6 km)</option>
          <option value="parques-conectados">Parque - Parques conectados (12 km)</option>
        </select>
      </div>

      <div class="mb-4">
        <label for="mensaje" class="form-label">Mensaje <span class="formulario-opcional">(opcional)</span></label>
        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí cualquier pregunta o detalle adicional"></textarea>
      </div>

      <button type="submit" class="btn btn-ruta w-100">Enviar consulta</button>
      <div class="alert alert-success mt-3 mb-0 d-none" id="confirmacion" role="status" aria-live="polite">
        Formulario validado. Esta es una demostración: tus datos no se enviaron ni se guardaron.
      </div>
    </form>
  </main>

  <script>
    const rutaSeleccionada = new URLSearchParams(window.location.search).get("ruta");
    const selectorRuta = document.getElementById("ruta");
    const formulario = document.getElementById("formularioConsulta");
    const confirmacion = document.getElementById("confirmacion");

    if (Array.from(selectorRuta.options).some((opcion) => opcion.value === rutaSeleccionada)) {
      selectorRuta.value = rutaSeleccionada;
    }

    formulario.addEventListener("submit", (event) => {
      event.preventDefault();
      confirmacion.classList.remove("d-none");
    });
  </script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
